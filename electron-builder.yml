# Packaging and publishing. Release artifacts go to a draft GitHub Release; see .github/workflows/release.yml.
appId: com.mehmetburaktaskaya.splitwatch
productName: Splitwatch
copyright: Copyright © 2026 Mehmet Burak Taşkaya

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json

asar: true

# splitwatch:// layout links: macOS (Info.plist) and Linux (.desktop) register them from here; on
# Windows the app registers itself (src/main/links.ts).
protocols:
  - name: Splitwatch layout
    schemes: [splitwatch]

# Hardening flags baked into the Electron binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

# File names carry no version, so releases/latest/download/<name> always gives the newest one. The
# release workflow adds copies that updates fetch under their own names (ADR 0013).
win:
  target:
    - target: nsis
      arch: [x64]
    # A portable copy: unzip and run. It updates itself from this ZIP (src/main/updates.ts).
    - target: zip
      arch: [x64]
  artifactName: Splitwatch-Portable-x64.${ext}

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Splitwatch-Setup-x64.${ext}

# Linux, experimental: an AppImage, which updates itself like the Windows installer.
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo
  artifactName: Splitwatch-x86_64.${ext}

# Ad-hoc signed: no paid Apple certificate. Users clear the quarantine flag once (see README).
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  identity: '-'
  hardenedRuntime: false
  category: public.app-category.sports
  # The .dmg is for people; the .zip is what a Mac copy updates itself from.
  artifactName: Splitwatch-macOS.${ext}

publish:
  provider: github
  owner: MehmetBurakTaskaya
  repo: splitwatch
  releaseType: draft
