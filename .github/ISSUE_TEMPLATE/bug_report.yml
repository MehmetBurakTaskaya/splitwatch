name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Splitwatch version
      description: Shown on the start screen.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to reproduce, one per line. Include the stream link if it matters.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: Error messages or codes (such as "Error 153") help a lot. Screenshots are welcome.
    validations:
      required: true
