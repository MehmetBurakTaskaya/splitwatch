name: Release

# A tag such as v0.1.0 builds the installers and attaches them, with the update metadata
# (latest.yml, latest-mac.yml), to a draft GitHub Release. Publishing the draft is a manual step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Create the draft release with the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Splitwatch $version" --notes-file notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --publish always
      - name: Start the packaged app once
        shell: bash
        env:
          SPLITWATCH_NO_UPDATES: '1'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            app="release/win-unpacked/Splitwatch.exe"
          else
            app="$(ls -d release/mac-universal/*.app)/Contents/MacOS/Splitwatch"
          fi
          "$app" --smoke-test
