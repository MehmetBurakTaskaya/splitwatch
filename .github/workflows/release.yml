name: Release

# A tag such as v0.1.0 builds the installers and attaches them, with the update metadata
# (latest.yml, latest-mac.yml, latest-linux.yml, latest-portable.yml), to a draft GitHub Release.
# Publishing the draft is a manual step; publishing hides the older releases (hide-old-releases.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Create the draft release with the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Splitwatch $version" --notes-file notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --publish always
      # Updates fetch a copy of the installer (and of the AppImage) under a name of its own, so the
      # download numbers tell people's downloads from updates (ADR 0013); the portable copy reads
      # latest-portable.yml, with the checksum of its ZIP.
      - name: Update files
        if: runner.os != 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp Splitwatch-Setup-x64.exe Splitwatch-Update-x64.exe
            cp Splitwatch-Setup-x64.exe.blockmap Splitwatch-Update-x64.exe.blockmap
            sed -i 's/Splitwatch-Setup-x64\.exe/Splitwatch-Update-x64.exe/g' latest.yml
            node ../scripts/portable-yml.mjs Splitwatch-Portable-x64.zip > latest-portable.yml
            files="Splitwatch-Update-x64.exe Splitwatch-Update-x64.exe.blockmap latest.yml latest-portable.yml"
          else
            cp Splitwatch-x86_64.AppImage Splitwatch-Update-x86_64.AppImage
            sed -i 's/Splitwatch-x86_64\.AppImage/Splitwatch-Update-x86_64.AppImage/g' latest-linux.yml
            files="Splitwatch-Update-x86_64.AppImage latest-linux.yml"
          fi
          cat latest*.yml
          gh release upload "$GITHUB_REF_NAME" --clobber $files
      - name: Start the packaged app once
        shell: bash
        env:
          SPLITWATCH_NO_UPDATES: '1'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            release/win-unpacked/Splitwatch.exe --smoke-test
          elif [ "$RUNNER_OS" = "macOS" ]; then
            "$(ls -d release/mac-universal/*.app)/Contents/MacOS/Splitwatch" --smoke-test
          else
            # Ubuntu's AppArmor blocks the user namespaces of Chromium's sandbox; this runner allows
            # them, as a user can for the app (see README). No display: a virtual one.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            xvfb-run -a release/linux-unpacked/splitwatch --smoke-test
          fi
